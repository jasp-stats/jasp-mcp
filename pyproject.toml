[project]
name = "jasp-mcp"
version = "0.1.0"
description = "MCP server for JASP statistical software — bridges JASP's JSON-RPC v2 API to MCP tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
jasp-mcp = "jasp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jasp_mcp"]
